name: workflow-platform-staging

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-workflow_staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-workflow_staging}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging_workflow_secret_2026}
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - workflow-postgres-staging-data:/var/lib/postgresql/data
    networks:
      - workflow-staging-network
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DATABASE_URL: jdbc:postgresql://postgres:5432/${STAGING_POSTGRES_DB:-workflow_staging}
      DATABASE_USERNAME: ${STAGING_POSTGRES_USER:-workflow_staging}
      DATABASE_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging_workflow_secret_2026}
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://staging.workflow.internal}
      CALLBACK_SIGNING_SECRET: ${STAGING_CALLBACK_SIGNING_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PLATFORM_FILES_ROOT: /app/storage
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workflow-staging-files:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - workflow-staging-network
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - workflow-staging-network
    restart: unless-stopped

networks:
  workflow-staging-network:
    driver: bridge

volumes:
  workflow-postgres-staging-data:
  workflow-staging-files:

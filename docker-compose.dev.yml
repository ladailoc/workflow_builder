name: workflow-platform-dev

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_platform}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow123}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - workflow-postgres-dev-data:/var/lib/postgresql/data
    networks:
      - workflow-dev-network
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-workflow_platform}
      DATABASE_USERNAME: ${POSTGRES_USER:-workflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-workflow123}
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - workflow-dev-network
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - workflow-dev-network
    restart: unless-stopped

networks:
  workflow-dev-network:
    driver: bridge

volumes:
  workflow-postgres-dev-data:

name: workflow-platform

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_platform}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow123}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - workflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  workflow-postgres-data:

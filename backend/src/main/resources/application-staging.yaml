spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:workflow_staging}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:workflow_staging}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      initialization-fail-timeout: 1
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      pool-name: WorkflowPlatformStagingPool
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

platform:
  outbox:
    publisher:
      enabled: true
      fixed-delay-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:20}
      lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
      retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:5}
  jobs:
    worker:
      enabled: true
      fixed-delay-ms: ${WORKFLOW_JOB_POLL_INTERVAL_MS:1000}
      batch-size: ${WORKFLOW_JOB_BATCH_SIZE:20}
      lease-seconds: ${WORKFLOW_JOB_LEASE_SECONDS:30}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://staging.workflow.local}
    jwt:
      secret: ${PLATFORM_SECURITY_JWT_SECRET}

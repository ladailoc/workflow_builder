spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:workflow_platform}
    username: ${POSTGRES_USER:workflow}
    password: ${POSTGRES_PASSWORD:change-me-for-local-development}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      initialization-fail-timeout: 1
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      pool-name: WorkflowPlatformPool
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}


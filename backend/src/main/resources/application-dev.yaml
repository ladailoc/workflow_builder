spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:workflow_platform}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:workflow}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:workflow123}}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      initialization-fail-timeout: 1
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      pool-name: WorkflowPlatformDevPool
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}


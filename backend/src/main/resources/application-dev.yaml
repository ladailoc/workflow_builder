spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:workflow_platform}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:workflow}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:workflow123}}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      initialization-fail-timeout: 1
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      pool-name: WorkflowPlatformDevPool
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

platform:
  security:
    # Local/demo frontend authenticates with the X-Actor-* headers.
    # Keep this enabled only for the non-production dev profile; production
    # profiles intentionally continue to require JWT authentication.
    dev-headers:
      enabled: true
  outbox:
    publisher:
      enabled: true
      fixed-delay-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:20}
      lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
      retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:5}
  seed:
    demo:
      enabled: true
      # Keep the organization directory populated while leaving workflow authoring to the user.
      workflows:
        enabled: ${PLATFORM_SEED_DEMO_WORKFLOWS_ENABLED:false}
  jobs:
    worker:
      enabled: true
      fixed-delay-ms: ${WORKFLOW_JOB_POLL_INTERVAL_MS:1000}
      batch-size: ${WORKFLOW_JOB_BATCH_SIZE:10}
      lease-seconds: ${WORKFLOW_JOB_LEASE_SECONDS:30}

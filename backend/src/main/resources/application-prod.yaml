spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:15000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      initialization-fail-timeout: 1
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      pool-name: WorkflowPlatformProdPool
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}

platform:
  outbox:
    publisher:
      enabled: true
      fixed-delay-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
      retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:5}
  jobs:
    worker:
      enabled: true
      fixed-delay-ms: ${WORKFLOW_JOB_POLL_INTERVAL_MS:1000}
      batch-size: ${WORKFLOW_JOB_BATCH_SIZE:20}
      lease-seconds: ${WORKFLOW_JOB_LEASE_SECONDS:30}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      secret: ${PLATFORM_SECURITY_JWT_SECRET}
